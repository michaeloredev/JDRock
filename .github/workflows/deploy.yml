# Push to main → build image → push to GHCR → pull and restart on the droplet.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/michaeloredev/jdrock
  APP_DIR: /srv/jdrock

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host droplet
            HostName ${{ secrets.DEPLOY_HOST }}
            User deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      - name: Copy compose file and Caddyfile
        run: scp deploy/docker-compose.yml deploy/Caddyfile droplet:${{ env.APP_DIR }}/

      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Token goes over stdin so it never appears in a process list
          printf '%s' "$GHCR_TOKEN" | ssh droplet "
            set -e
            docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ${{ env.APP_DIR }}
            docker compose pull app
            docker compose up -d --remove-orphans
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker logout ghcr.io
            docker image prune -f
          "

      - name: Check site is up
        run: |
          for i in $(seq 1 12); do
            if curl -fsS -o /dev/null https://jdrock.com; then echo "jdrock.com is up"; exit 0; fi
            sleep 5
          done
          echo "jdrock.com did not respond with 2xx after deploy" >&2
          exit 1
